        </div>
    </header>

    <main>
        <!-- ============ Contact ============ -->
        <section id="contact" class="contact section">
            <div class="section-inner contact-grid">
                <div class="contact-intro reveal">
                    <p class="section-label">04 — Get in Touch</p>
                    <h2 class="section-title">Contact Me</h2>
                    <p class="contact-lede">Open to data science and analytics opportunities, research collaborations, or just a good conversation about data.</p>
                    <div class="contact-links">
                        <a href="mailto:aserikkyzy@knox.edu">aserikkyzy@knox.edu</a>
                    </div>
                    <div class="social-icons">
                        <a href="https://www.facebook.com/profile.php?id=100087925912612&mibextid=LQQJ4d" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a>
                        <a href="https://www.instagram.com/botaserikk/profilecard/?igsh=MXQ0cDdpdDl2Mzk3bA==" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
                        <a href="https://www.linkedin.com/in/akbota-serikkyzy-401957296" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
                    </div>
                </div>
                <div class="contact-right reveal">
                    <form class="contact-form" name="submit-to-google-sheet">
                        <div class="form-field">
                            <label for="contact-name">Name</label>
                            <input type="text" id="contact-name" name="Name" placeholder="Your name" required>
                        </div>
                        <div class="form-field">
                            <label for="contact-email">Email</label>
                            <input type="email" id="contact-email" name="Email" placeholder="you@email.com" required>
                        </div>
                        <div class="form-field">
                            <label for="contact-message">Message</label>
                            <textarea id="contact-message" name="Message" rows="5" placeholder="What's on your mind?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-solid">Send message</button>
                    </form>
                    <span id="msg" role="status" aria-live="polite"></span>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
